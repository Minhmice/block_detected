[project]
name = "block-detected"
version = "0.1.0"
description = "YOLO webcam block detection with PySide6 desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.8.0",
    "PySide6>=6.7",
    "windows-curses>=2.4.0; platform_system == \"Windows\"",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
block-detected = "block_detected.apps.gui.app:main"
block-detected-web = "block_detected.apps.web.server:main"
block-detected-tui = "block_detected.apps.tui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
