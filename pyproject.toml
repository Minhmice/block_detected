[project]
name = "block-detected"
version = "0.1.0"
description = "YOLO webcam block detection — Robo-Vision desktop GUI and TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python-headless>=4.8.0",
    "PySide6>=6.7",
    "textual>=8.0",
    "rich>=13.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
tui = ["textual>=8.0", "rich>=13.7"]
viewer = ["opencv-python>=4.8.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["opencv-python>=4.8.0", "PySide6>=6.7"]

[project.scripts]
block-detected = "block_detected.apps.launcher:main"
block-detected-gui = "block_detected.apps.gui.app:main"
block-detected-tui = "block_detected.apps.tui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
