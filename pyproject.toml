[project]
name = "block-detected"
version = "1.0.0"
description = "YOLO block detection — OpenCV view, TUI, and Pi camera stream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python-headless>=4.8.0",
    "textual>=8.0",
    "rich>=13.7",
    "onnxruntime>=1.22.0",
]

[project.optional-dependencies]
view = ["opencv-python>=4.8.0"]
tui = ["textual>=8.0", "rich>=13.7"]
stream = ["opencv-python-headless>=4.8.0"]
viewer = ["opencv-python>=4.8.0"]
pi = [
    "ultralytics>=8.4.0",
    "opencv-python-headless>=4.8.0",
    "textual>=8.0",
    "rich>=13.7",
    "onnxruntime>=1.22.0",
]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.24"]
control-drivehub = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]
all = ["opencv-python>=4.8.0"]

[project.scripts]
block-detected = "main:main"
block-detected-stream = "stream.__main__:main"
block-detected-view = "view.app:main"
block-detected-tui = "block_detected.tui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["main", "bootstrap"]
