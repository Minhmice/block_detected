services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOCK_CAMERA: "true"
      DETECTION_MODE: mock
      CORS_ORIGINS: http://localhost:3000
      CAMERA_CONFIG: config/camera.example.json
      VISION_CONFIG: config/vision.example.json
      DATASET_DIR: /app/datasets/captured
    volumes:
      - ./datasets:/app/datasets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/detection
        NEXT_PUBLIC_STREAM_URL: http://localhost:8000/video/stream
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional nginx reverse proxy (enable with: docker compose --profile nginx up)
  # nginx:
  #   image: nginx:alpine
  #   profiles: ["nginx"]
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - frontend
  #     - backend
